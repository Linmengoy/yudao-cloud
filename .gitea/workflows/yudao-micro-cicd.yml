name: yudao-micro-cicd

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Docker service to build/deploy, use all for all services'
        type: choice
        required: false
        default: 'aigc-gen'
        options:
          - aigc-gen
          - all
          - yudao-gateway
          - yudao-system
          - yudao-infra
          - yudao-member
          - yudao-pay
          - aigc-model
          - aigc-billing
          - aigc-task
          - aigc-asset
          - aigc-safety
          - aigc-workflow
          - aigc-community
          - draw2video-admin
          - draw2video-client
          - draw2video-guide
      previous_stable_image_tag:
        description: 'Previous stable test image tag for rollback evidence, for example v0.0.1'
        required: false
        default: ''

jobs:
  build-deploy:
    runs-on: manman

    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d .git ]; then
            git remote remove origin 2>/dev/null || true
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
            git fetch --prune origin
            git clean -fdx
          else
            git init .
            git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          fi

          git -c http.extraHeader="Authorization: token ${GITEA_TOKEN}" fetch --depth=1 origin "${{ github.ref }}"
          git checkout -f FETCH_HEAD
          git clean -fdx

      - name: Show host environment
        run: |
          whoami
          hostname
          pwd
          git --version
          java -version
          mvn -version
          docker version
          docker compose version

      - name: Resolve build target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ github.event.inputs.service }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            service="${INPUT_SERVICE:-aigc-gen}"
          else
            service="all"
          fi

          test_image_version_file="script/docker/test-image-version"
          image_tag="$(tr -d '[:space:]' < "${test_image_version_file}")"
          if ! printf '%s' "${image_tag}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid test image version in ${test_image_version_file}: ${image_tag}"
            exit 1
          fi

          case "${service}" in
            all) module="all" ;;
            yudao-gateway) module="yudao-gateway" ;;
            yudao-system) module="yudao-module-system/yudao-module-system-server" ;;
            yudao-infra) module="yudao-module-infra/yudao-module-infra-server" ;;
            yudao-member) module="yudao-module-member/yudao-module-member-server" ;;
            yudao-pay) module="yudao-module-pay/yudao-module-pay-server" ;;
            aigc-model) module="yudao-module-aigc-model/yudao-module-aigc-model-server" ;;
            aigc-billing) module="yudao-module-aigc-billing/yudao-module-aigc-billing-server" ;;
            aigc-task) module="yudao-module-aigc-task/yudao-module-aigc-task-server" ;;
            aigc-asset) module="yudao-module-aigc-asset/yudao-module-aigc-asset-server" ;;
            aigc-safety) module="yudao-module-aigc-safety/yudao-module-aigc-safety-server" ;;
            aigc-workflow) module="yudao-module-aigc-workflow/yudao-module-aigc-workflow-server" ;;
            aigc-community) module="yudao-module-aigc-community/yudao-module-aigc-community-server" ;;
            aigc-gen) module="yudao-module-aigc-gen/yudao-module-aigc-gen-server" ;;
            draw2video-admin) module="frontend" ;;
            draw2video-client) module="frontend" ;;
            draw2video-guide) module="frontend" ;;
            *) echo "Unknown service: ${service}" && exit 1 ;;
          esac

          if [ "${service}" != "all" ]; then
            docker compose -f script/docker/docker-compose-micro.yml config --services | grep -Fx "${service}"
          fi

          echo "BUILD_SERVICE=${service}" >> "${GITHUB_ENV}"
          echo "BUILD_MODULE=${module}" >> "${GITHUB_ENV}"
          echo "DEPLOY_ENV=test" >> "${GITHUB_ENV}"
          echo "TEST_IMAGE_VERSION_FILE=${test_image_version_file}" >> "${GITHUB_ENV}"
          echo "MICRO_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          echo "FRONTEND_IMAGE_TAG=${image_tag}" >> "${GITHUB_ENV}"
          echo "PREVIOUS_STABLE_IMAGE_TAG=${{ github.event.inputs.previous_stable_image_tag }}" >> "${GITHUB_ENV}"
          echo "RELEASE_EVIDENCE_FILE=tmp/release-evidence/${service}-${image_tag}.md" >> "${GITHUB_ENV}"

      - name: Enforce rollback version gate
        run: |
          bash script/docker/verify-release-evidence.sh preflight

      - name: Write release evidence summary
        run: |
          mkdir -p tmp/release-evidence
          evidence="${RELEASE_EVIDENCE_FILE}"
          {
            echo "release evidence"
            echo "- workflow run url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- runner: ${RUNNER_NAME:-manman}"
            echo "- service: ${BUILD_SERVICE}"
            echo "- module: ${BUILD_MODULE}"
            echo "- target environment: test"
            echo "- test image version file: ${TEST_IMAGE_VERSION_FILE}"
            echo "- commit sha: $(git rev-parse HEAD)"
            echo "- immutable image tag: ${MICRO_IMAGE_TAG}"
            echo "- frontend image tag: ${FRONTEND_IMAGE_TAG}"
            echo "- previous stable image tag: ${PREVIOUS_STABLE_IMAGE_TAG:-not-provided}"
            echo "- maven command: mvn clean package -pl ${BUILD_MODULE} -am -DskipTests"
            echo "- image build command: docker compose -f script/docker/docker-compose-micro.yml build ${BUILD_SERVICE}"
            echo "- compose up command: docker compose -f script/docker/docker-compose-micro.yml up -d --no-deps ${BUILD_SERVICE}"
            echo "- rollback command: MICRO_IMAGE_TAG=<previous-test-version> FRONTEND_IMAGE_TAG=<previous-test-version> docker compose -f script/docker/docker-compose-micro.yml up -d --no-build --no-deps --force-recreate ${BUILD_SERVICE}"
            echo "- smoke checklist: script/docker/community-release-gates.md"
            echo "- evidence index: script/docker/community-release-evidence-index.md"
          } | tee "${evidence}"

      - name: Enforce community DB evidence gate
        if: env.BUILD_SERVICE == 'aigc-community' || env.BUILD_SERVICE == 'all'
        run: |
          bash script/docker/verify-release-evidence.sh db-evidence

      - name: Build jar
        run: |
          echo "Build service: ${BUILD_SERVICE}"
          echo "Build module: ${BUILD_MODULE}"

          if [ "${BUILD_MODULE}" = "frontend" ]; then
            echo "Skip Maven build for frontend service: ${BUILD_SERVICE}"
          elif [ "${BUILD_MODULE}" = "all" ]; then
            mvn clean package -DskipTests
          else
            mvn clean package -pl "${BUILD_MODULE}" -am -DskipTests
          fi

      - name: Build image
        run: |
          echo "Build service: ${BUILD_SERVICE}"

          if [ "${BUILD_SERVICE}" = "all" ]; then
            docker compose -f script/docker/docker-compose-micro.yml build
          else
            docker compose -f script/docker/docker-compose-micro.yml build "${BUILD_SERVICE}"
          fi

      - name: Deploy services
        run: |
          deploy_env="master-jdk17"
          echo "Deploy env: ${deploy_env}"

          if [ "${BUILD_SERVICE}" = "all" ]; then
            docker compose -f script/docker/docker-compose-micro.yml up -d
          else
            docker compose -f script/docker/docker-compose-micro.yml up -d --no-deps "${BUILD_SERVICE}"
          fi

      - name: Verify services
        run: |
          deploy_env="master-jdk17"
          echo "Verify env: ${deploy_env}"
          echo "Build service: ${BUILD_SERVICE}"

          docker compose -f script/docker/docker-compose-micro.yml ps

          if [ "${BUILD_SERVICE}" = "all" ]; then
            verify_services="yudao-gateway yudao-system yudao-infra yudao-member yudao-pay aigc-model aigc-billing aigc-task aigc-asset aigc-safety aigc-gen aigc-workflow aigc-community draw2video-admin draw2video-client draw2video-guide"
          else
            verify_services="${BUILD_SERVICE}"
          fi

          for service in ${verify_services}; do
            service_running="false"
            for i in $(seq 1 30); do
              state=$(docker compose -f script/docker/docker-compose-micro.yml ps --status running --services | grep -Fx "${service}" || true)
              echo "${service}: ${state:-not-running}"
              if [ "${state}" = "${service}" ]; then
                service_running="true"
                break
              fi
              sleep 5
            done

            if [ "${service_running}" = "true" ]; then
              continue
            fi

            docker compose -f script/docker/docker-compose-micro.yml logs --tail=100 "${service}"
            exit 1
          done

          if [ "${BUILD_SERVICE}" = "aigc-community" ] || [ "${BUILD_SERVICE}" = "all" ]; then
            COMMUNITY_HEALTH_URL="http://127.0.0.1:48097/actuator/health" \
            GATEWAY_BASE_URL="http://127.0.0.1:48080" \
            COMPOSE_FILE_PATH="script/docker/docker-compose-micro.yml" \
              bash script/docker/verify-release-evidence.sh verify-http
          fi

      - name: Append release verification evidence
        if: always()
        run: |
          mkdir -p tmp/release-evidence
          evidence="${RELEASE_EVIDENCE_FILE:-tmp/release-evidence/${BUILD_SERVICE:-unknown}-${MICRO_IMAGE_TAG:-unknown}.md}"
          {
            echo
            echo "deployment verification"
            echo "- verified at: $(date -Is)"
            echo "- deploy env: master-jdk17"
            echo "- docker compose version: $(docker compose version 2>/dev/null || true)"
            echo "- compose ps summary:"
            docker compose -f script/docker/docker-compose-micro.yml ps || true
            if [ "${BUILD_SERVICE}" = "aigc-community" ] || [ "${BUILD_SERVICE}" = "all" ]; then
              echo "- strict gate:"
              echo "  script/docker/verify-release-evidence.sh verify-http must pass before this workflow can succeed"
              echo
              echo "- gateway smoke commands:"
              echo "  curl -i -sS --fail-with-body http://127.0.0.1:48080/admin-api/aigc/community/admin/post/page?pageNo=1&pageSize=1"
              echo "  curl -i -sS --fail-with-body http://127.0.0.1:48080/app-api/aigc/community/post/page?pageNo=1&pageSize=1"
            fi
          } | tee -a "${evidence}"
