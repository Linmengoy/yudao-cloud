name: yudao-micro-cicd

on:
  push:
    branches:
      - develop
      - test
      - master
      - master-jdk17
    tags:
      - v*
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        env:
          GITEA_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -c http.extraHeader="Authorization: token ${GITEA_TOKEN}" fetch --depth=1 origin "${{ github.ref }}"
          git checkout FETCH_HEAD

      - name: Build jar
        run: mvn clean package -DskipTests

      - name: Build aigc-gen image
        run: docker compose -f script/docker/docker-compose-micro.yml build aigc-gen

      - name: Deploy services
        run: |
          deploy_env="build-only"
          if echo "${{ github.ref }}" | grep -q '^refs/tags/v'; then
            deploy_env="prod"
          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
            deploy_env="test"
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            deploy_env="prod"
          elif [ "${{ github.ref }}" = "refs/heads/master-jdk17" ]; then
            deploy_env="master-jdk17"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            deploy_env="dev"
          fi

          echo "Deploy env: ${deploy_env}"
          if [ "${deploy_env}" = "build-only" ]; then
            echo "Skip deploy for ${{ github.ref }}"
            exit 0
          fi

          docker compose -f script/docker/docker-compose-micro.yml up -d --build

      - name: Verify services
        run: |
          deploy_env="build-only"
          if echo "${{ github.ref }}" | grep -q '^refs/tags/v'; then
            deploy_env="prod"
          elif [ "${{ github.ref }}" = "refs/heads/test" ]; then
            deploy_env="test"
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            deploy_env="prod"
          elif [ "${{ github.ref }}" = "refs/heads/master-jdk17" ]; then
            deploy_env="master-jdk17"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            deploy_env="dev"
          fi

          if [ "${deploy_env}" = "build-only" ]; then
            echo "Skip verify for ${{ github.ref }}"
            exit 0
          fi

          docker compose -f script/docker/docker-compose-micro.yml ps
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:48080/ || true)
            echo "Gateway: ${code}"
            if [ "${code}" != "000" ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f script/docker/docker-compose-micro.yml logs --tail=100 yudao-gateway yudao-system yudao-infra yudao-member yudao-pay aigc-model aigc-billing aigc-task aigc-asset aigc-safety aigc-gen
          exit 1
