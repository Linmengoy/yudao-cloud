name: yudao-cloud-micro-prod

services:
  mysql:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.0
    container_name: yudao-mysql-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 123456
    networks:
      - yudao-network-prod
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - /opt/data/mysql-data-prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/redis:7.2-alpine
    container_name: yudao-redis-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
    networks:
      - yudao-network-prod
    ports:
      - "6379:6379"
    volumes:
      - /opt/data/redis-data-prod:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: m.daocloud.io/docker.io/nacos/nacos-server:v3.0.3
    container_name: yudao-nacos-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "JYWobuGwRzIm/9YYE6DWUvJK+bdDNBGUB7UKpdNsLG4="
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
      JVM_XMS: 512m
      JVM_XMX: 1024m
      JVM_XMN: 256m
    networks:
      - yudao-network-prod
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    volumes:
      - /opt/data/yudao-nacos-data-prod:/home/nacos/data
      - /opt/data/yudao-nacos-logs-prod:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  xxl-job-admin:
    image: m.daocloud.io/docker.io/xuxueli/xxl-job-admin:2.4.0
    container_name: xxl-job-admin-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      PARAMS: >-
        --server.port=8080
        --server.servlet.context-path=/xxl-job-admin
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
        --spring.datasource.username=root
        --spring.datasource.password=123456
        --xxl.job.accessToken=default_token
    networks:
      - yudao-network-prod
    ports:
      - "9090:8080"
    volumes:
      - /opt/data/xxl-job-admin-logs-prod:/data/applogs
    depends_on:
      mysql:
        condition: service_healthy

  yudao-system:
    build:
      context: ../../yudao-module-system/yudao-module-system-server
      dockerfile: Dockerfile
    image: yudao-system:latest
    container_name: yudao-system-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      SPRING_CLOUD_NACOS_DISCOVERY_GROUP: DEFAULT_GROUP
      SPRING_CLOUD_NACOS_CONFIG_GROUP: DEFAULT_GROUP
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48081:48081"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  yudao-infra:
    build:
      context: ../../yudao-module-infra/yudao-module-infra-server
      dockerfile: Dockerfile
    image: yudao-infra:latest
    container_name: yudao-infra-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      SPRING_CLOUD_NACOS_DISCOVERY_GROUP: DEFAULT_GROUP
      SPRING_CLOUD_NACOS_CONFIG_GROUP: DEFAULT_GROUP
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48082:48082"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      yudao-system:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  yudao-pay:
    build:
      context: ../../yudao-module-pay/yudao-module-pay-server
      dockerfile: Dockerfile
    image: yudao-pay:latest
    container_name: yudao-pay-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48085:48085"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      yudao-system:
        condition: service_started
      yudao-infra:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  aigc-model:
    build:
      context: ../../yudao-module-aigc-model/yudao-module-aigc-model-server
      dockerfile: Dockerfile
    image: aigc-model:latest
    container_name: aigc-model-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48090:48090"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      yudao-system:
        condition: service_started
      yudao-infra:
        condition: service_started

  aigc-billing:
    build:
      context: ../../yudao-module-aigc-billing/yudao-module-aigc-billing-server
      dockerfile: Dockerfile
    image: aigc-billing:latest
