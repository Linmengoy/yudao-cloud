  aigc-community:
    build:
      context: ../../yudao-module-aigc-community/yudao-module-aigc-community-server
      dockerfile: Dockerfile
    image: aigc-community:${MICRO_IMAGE_TAG:-latest}
    container_name: aigc-community-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      SPRING_CLOUD_NACOS_DISCOVERY_GROUP: DEFAULT_GROUP
      SPRING_CLOUD_NACOS_CONFIG_GROUP: DEFAULT_GROUP
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48097:48097"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:48097/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      yudao-system:
        condition: service_started
      yudao-infra:
        condition: service_started
      yudao-member:
        condition: service_started
      aigc-asset:
        condition: service_started
      aigc-workflow:
        condition: service_started

  yudao-member:
    build:
      context: ../../yudao-module-member/yudao-module-member-server
      dockerfile: Dockerfile
    image: yudao-member:latest
    container_name: yudao-member-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48087:48087"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      yudao-system:
        condition: service_started
      yudao-infra:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started

  yudao-gateway:
    build:
      context: ../../yudao-gateway
      dockerfile: Dockerfile
    image: yudao-gateway:latest
    container_name: yudao-gateway-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_NACOS_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE: prod
      SPRING_CLOUD_NACOS_CONFIG_NAMESPACE: prod
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48080:48080"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      yudao-system:
        condition: service_started
      yudao-infra:
        condition: service_started

  draw2video-admin:
    build:
      context: ../../yudao-ui/draw2video-admin
      dockerfile: Dockerfile
    image: draw2video-admin:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-admin-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
    networks:
      - yudao-network-prod
    ports:
      - "8081:80"
    depends_on:
      yudao-gateway:
        condition: service_started

  draw2video-client:
    build:
      context: ../../yudao-ui/draw2video-client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_APP_API_PREFIX: /app-api
    image: draw2video-client:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-client-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_APP_API_PREFIX: /app-api
    networks:
      - yudao-network-prod
    ports:
      - "3000:3000"
    depends_on:
      yudao-gateway:
        condition: service_started

  draw2video-guide:
    build:
      context: ../../yudao-ui/draw2video-guide
      dockerfile: Dockerfile
    image: draw2video-guide:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-guide-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
    networks:
      - yudao-network-prod
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      yudao-gateway:
        condition: service_started


volumes:
  yudao-mysql-data-prod:
  yudao-redis-data-prod:
  yudao-nacos-data-prod:
  yudao-nacos-logs-prod:
  yudao-logs-prod:

networks:
  yudao-network-prod:
    name: yudao-network-prod