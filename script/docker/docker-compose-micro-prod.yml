    image: aigc-task:latest
    container_name: aigc-task-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48091:48091"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      yudao-system:
        condition: service_started

  aigc-asset:
    build:
      context: ../../yudao-module-aigc-asset/yudao-module-aigc-asset-server
      dockerfile: Dockerfile
    image: aigc-asset:latest
    container_name: aigc-asset-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48093:48093"
    volumes:
      - /opt/data/yudao-logs-prod:/root/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_started
      yudao-system:
        condition: service_started
      yudao-infra:
        condition: service_started

  aigc-safety:
    build:
      context: ../../yudao-module-aigc-safety/yudao-module-aigc-safety-server
      dockerfile: Dockerfile
    image: aigc-safety:latest
    container_name: aigc-safety-prod
    restart: always
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: -Xms1024m -Xmx1024m
    networks:
      - yudao-network-prod
    ports:
      - "48094:48094"
    volumes:
