services:
  draw2video-admin:
    image: ${FRONTEND_IMAGE_REGISTRY_PREFIX:-}draw2video-admin:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-admin
    restart: always
    ports:
      - "8081:80"

  draw2video-client:
    image: ${FRONTEND_IMAGE_REGISTRY_PREFIX:-}draw2video-client:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-client
    restart: always
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_GATEWAY_HOST: host.docker.internal
      NEXT_PUBLIC_GATEWAY_PORT: 48080
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_APP_API_PREFIX: /app-api
      NEXT_PUBLIC_WS_BASE_URL: wss://beta.copse.top
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "13000:3000"

  draw2video-guide:
    image: ${FRONTEND_IMAGE_REGISTRY_PREFIX:-}draw2video-guide:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-guide
    restart: always
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
