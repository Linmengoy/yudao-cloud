services:
  draw2video-admin:
    image: ${FRONTEND_IMAGE_REGISTRY_PREFIX:-}draw2video-admin:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-admin
    restart: always
    environment:
      ADMIN_GATEWAY_HOST: "${ADMIN_GATEWAY_HOST:-host.docker.internal}"
      ADMIN_GATEWAY_PORT: "${ADMIN_GATEWAY_PORT:-48080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  draw2video-client:
    image: ${FRONTEND_IMAGE_REGISTRY_PREFIX:-}draw2video-client:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-client
    restart: always
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      APP_GATEWAY_HOST: "${CLIENT_GATEWAY_HOST:-host.docker.internal}"
      APP_GATEWAY_PORT: "${CLIENT_GATEWAY_PORT:-48080}"
      NEXT_PUBLIC_GATEWAY_HOST: "${CLIENT_GATEWAY_HOST:-host.docker.internal}"
      NEXT_PUBLIC_GATEWAY_PORT: "${CLIENT_GATEWAY_PORT:-48080}"
      NEXT_PUBLIC_API_BASE_URL: "${CLIENT_API_BASE_URL:-}"
      NEXT_PUBLIC_APP_API_PREFIX: "${CLIENT_APP_API_PREFIX:-/app-api}"
      NEXT_PUBLIC_WS_BASE_URL: "${CLIENT_WS_BASE_URL-}"
      NEXT_PUBLIC_TENANT_ID: "${CLIENT_TENANT_ID:-1}"
      NEXT_PUBLIC_TERMINAL: "${CLIENT_TERMINAL:-20}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "13000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode>=200&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  draw2video-guide:
    image: ${FRONTEND_IMAGE_REGISTRY_PREFIX:-}draw2video-guide:${FRONTEND_IMAGE_TAG:-latest}
    container_name: draw2video-guide
    restart: always
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
