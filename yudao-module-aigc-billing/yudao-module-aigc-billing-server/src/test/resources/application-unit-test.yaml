spring:
  main:
    lazy-initialization: true
    banner-mode: off

--- #################### 数据库相关配置 ####################

spring:
  datasource:
    name: yudao-aigc-billing
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=value;
    driver-class-name: org.h2.Driver
    username: sa
    password:
    druid:
      async-init: true
      initial-size: 1
  sql:
    init:
      schema-locations: classpath:/sql/create_tables.sql
  cloud:
    nacos:
      config:
        import-check:
          enabled: false

mybatis-plus:
  lazy-initialization: true
  type-aliases-package: ${yudao.info.base-package}.dal.dataobject
  global-config:
    db-config:
      id-type: AUTO

--- #################### 芋道相关配置 ####################

yudao:
  info:
    base-package: cn.iocoder.yudao.module.aigc.billing
  tenant:
    enable: false
