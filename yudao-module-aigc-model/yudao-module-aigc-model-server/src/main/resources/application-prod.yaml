spring:
  cloud:
    nacos:
      # server-addr: 127.0.0.1:8848 # Nacos 服务器地址
      server-addr: 10.66.0.2:8848 # Nacos 服务器地址
      username: nacos # Nacos 账号
      password: nacos  # Nacos 密码
      discovery: # 【配置中心】配置项
        namespace: prod # 命名空间。这里使用 dev 开发环境
        group: DEFAULT_GROUP # 使用的 Nacos 配置分组，默认为 DEFAULT_GROUP
        metadata:
          version: 1.0.0 # 服务实例的版本号，可用于灰度发布
      config: # 【注册中心】配置项
        encode: UTF-8
        namespace: prod # 命名空间。这里使用 dev 开发环境
        group: DEFAULT_GROUP # 使用的 Nacos 配置分组，默认为 DEFAULT_GROUP

logging:
  level:
    cn.iocoder.yudao.module.aigc.model: debug

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000

--- #################### 监控相关配置 ####################

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

spring:
  boot:
    admin:
      client:
        instance:
          service-host-type: IP
        username: admin
        password: admin

logging:
  level:
    cn.iocoder.yudao.module.aigc.model.dal.mysql: debug
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

--- #################### 芋道相关配置 ####################

yudao:
  env:
    tag: ${HOSTNAME}
  captcha:
    enable: false
  security:
    mock-enable: true
  access-log:
    enable: true
