--- #################### 注册中心 + 配置中心相关配置 ####################

spring:
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:10.66.0.2:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: prod
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
      config:
        namespace: prod
        group: DEFAULT_GROUP

    


--- #################### MQ 消息队列相关配置 ####################

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:rocketmq:9876}

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

--- #################### 定时任务相关配置 ####################

xxl:
  job:
    enabled: true
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://xxl-job-admin:8080/xxl-job-admin}

--- #################### 服务保障相关配置 ####################

lock4j:
  acquire-timeout: 3000
  expire: 30000
