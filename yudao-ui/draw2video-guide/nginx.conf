server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location = / {
    return 302 /guide/;
  }

  location /guide/ {
    try_files $uri $uri/ /guide/index.html;
  }
}

